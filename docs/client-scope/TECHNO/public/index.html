<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SOAR</title>
   <link rel="stylesheet" href="style.css?v=ipadfinal">
    
    <!-- Supabase JavaScript Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Login Section -->
    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome to SOAR</h2>
            <p>Login to manage your applications and organization events.</p>
            
            <form id="login-form">
                <!-- User Roles -->
                <div class="user-type-toggle">
                    <label>
                        <input type="radio" name="user_type" value="student" checked> Student
                    </label>
                    <label>
                        <input type="radio" name="user_type" value="sponsor"> Sponsor
                    </label>
                    <label>
                        <input type="radio" name="user_type" value="organization"> Organization
                    </label>
                </div>

                <!-- Input Fields -->
                <div class="input-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="e.g., user@ustp.edu.ph" required>
                </div>

                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <!-- Add this right above your <button type="submit">Login</button> -->
                <div style="text-align: right; margin-bottom: 1.5rem;">
                    <a href="#" id="forgot-password-link" style="color: var(--primary-purple); font-size: 0.85rem; text-decoration: none; font-weight: 500;">Forgot Password?</a>
                </div>
                <button type="submit" style="width: 100%; padding: 0.75rem; background-color: #0f4c5c; color: white; border: none; border-radius: 6px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer;">Log In</button>
            </form>
            
            <p style="text-align: center; margin-top: 1rem;">
                Don't have an account? <a href="register.html">Register here</a>
            </p>
        </div>
    </div>

    <!-- Main Script Link -->
    <script type="module" src="script.js?v=verified"></script>
</body>
</html>
